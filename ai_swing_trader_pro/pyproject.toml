[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-swing-trader-pro"
version = "0.2.0"
description = "AI-assisted swing trading platform — Sprint 2: core architecture, config, logging, and database scaffolding."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "AI Swing Trader Pro Team" }
]
keywords = ["trading", "swing-trading", "clean-architecture", "sqlalchemy"]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "loguru>=0.7.2,<0.8",
    "sqlalchemy>=2.0.30,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "kiteconnect>=4.2.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.8",
]

[project.scripts]
ai-swing-trader-pro = "ai_swing_trader_pro.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_swing_trader_pro"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=ai_swing_trader_pro --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ai_swing_trader_pro"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["src/ai_swing_trader_pro"]
